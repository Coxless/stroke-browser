# Ubuntu 用の開発環境（Canonical Workshop）。手順は docs/dev-environment.md
name: dev
base: ubuntu@24.04
sdks:
  - name: rust
    channel: latest/stable
  # .workshop/stroke-dev/ にある、このリポジトリ専用の SDK
  - name: project-stroke-dev
actions:
  check: |
    bash /project/scripts/check-env.sh "$@"
  # ブラウザを起動する。X11 は使わない（docs/dev-environment.md の「安全に動かす」）
  run-browser: |
    if [ -z "${WAYLAND_DISPLAY:-}" ]; then
      echo "Wayland につながっていない。X11 では起動しない" >&2
      exit 1
    fi
    cd /project && env -u DISPLAY cargo run -p stroke -- "$@"
